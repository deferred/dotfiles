gui:
  nerdFontsVersion: "3"

keybinding:
  commits:
    moveDownCommit: '<ctrl+n>'
    moveUpCommit: '<ctrl+p>'

customCommands:
  - key: "t"
    context: "commits"
    description: "Revert with conventional commit message"
    prompts:
      - type: "input"
        title: "Commit message"
        key: "Message"
        initialValue: 'revert: "{{.SelectedCommit.Name}}"'
    command: >-
      git revert --no-commit {{.SelectedCommit.Hash}} &&
      git commit -m {{.Form.Message | quote}}
    loadingText: "Reverting commit"
    after:
      checkForConflicts: true
