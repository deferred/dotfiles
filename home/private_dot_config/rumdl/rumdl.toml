# rumdl user-level configuration
# Applied when no project configuration (.rumdl.toml, rumdl.toml,
# .config/rumdl.toml, or pyproject.toml [tool.rumdl]) is found.

[global]
disable = ["MD041"]
# List of file/directory patterns to exclude from linting
exclude = [
    ".git",
    ".github",
    "node_modules",
    "vendor",
    "dist",
    "build",

    "CHANGELOG.md",
    "LICENSE.md",
    "**/openspec-*/**",
    "**/opsx-*.md",
]

respect-gitignore = true
line-length = 120

[MD013]
reflow = true
